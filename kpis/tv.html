    const known = new Set(DATA.deals.map((d) => d.id));
    const fresh = DAVID.on ? L.filter((d) => !known.has(d.id)) : L;
    DAVID.on = true;
    DATA.deals = L;
    DATA.deals_updated_label = j.generated ? new Date(j.generated).toLocaleString("en-US", { timeZone: TZ, month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) + " (David feed)" : "David feed";
    const al = gate(fresh, "david");
    al.forEach((d) => SEEN_NEW.add(d.id));
    paint(cur);
    if (al.length) {
      queue.push(...al);
      runAlerts();
    }
  } catch (e) {
  }
  updLabel();
}
if (!Q.has("nodavid")) {
  davidPoll();
  setInterval(davidPoll, (+Q.get("davidpoll") || 30) * 1e3);
}
show(Q.has("slide") ? +Q.get("slide") : 0);
updLabel();
poll();
setInterval(poll, POLL_MS);
setInterval(() => location.reload(), 6 * 3600 * 1e3);
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") show(cur + 1);
  if (e.key === "ArrowLeft") show(cur - 1);
});
</script></body></html>
