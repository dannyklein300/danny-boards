        const ids = new Set(L.map((d) => String(d.id)));
        (j.history || []).forEach((d) => ids.add(String(d.id)));
        Object.keys(FEED).forEach((k) => {
          if (!ids.has(k)) dropDeal(k);
        });
      }
      ingest(L, true, "poll");
      paint(cur);
    } catch (e) {
    }
  };
  fp();
  setInterval(fp, (+Q.get("feedpoll") || 3) * 1e3);
}
if (Q.get("sse")) {
  const SSEU = Q.get("sse");
  const PU = SSEU.replace(/\/sse(\?.*)?$/, "/deals.json");
  if (!window.EventSource) {
    startPoll(PU);
  } else {
    let fails = 0;
    const es = new EventSource(SSEU);
    let gotSnap = false;
    es.addEventListener("snapshot", () => {
      gotSnap = true;
    });
    setTimeout(() => {
      if (!gotSnap) {
        try {
          es.close();
        } catch (x) {
        }
        startPoll(PU);
      }
    }, 8e3);
    es.addEventListener("open", () => {
      fails = 0;
      feedPrimed = true;
    });
    es.onerror = () => {
      fails++;
      if (fails >= 4) {
        try {
          es.close();
        } catch (x) {
        }
        startPoll(PU);
      }
    };
    es.addEventListener("snapshot", (e) => {

        const j = JSON.parse(e.data);
        const ids = new Set((j.deals || []).concat(j.history || []).map((d) => String(d.id)));
        Object.keys(FEED).forEach((k) => {
          if (!ids.has(k)) dropDeal(k);
        });
        ingest((j.history || []).concat(j.deals || []), false, "sse");
        PRIMED.sse = 1;
        paint(cur);
      } catch (x) {
      }
    });
    es.addEventListener("remove", (e) => {
      try {
        dropDeal(String(JSON.parse(e.data).id));
        paint(cur);
      } catch (x) {
      }
    });
    es.onmessage = (e) => {
      try {
        const j = JSON.parse(e.data);
        ingest(Array.isArray(j) ? j : j.deals || [j], true, "sse");
      } catch (x) {
      }
    };
  }
}

function fnv(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h.toString(16);
}
function davidDeal(r) {
  const dt = new Date(r.time || r.timestamp);
  const name = r.agent || r.name || "";
  return {
    id: String(r.id || "dv-" + fnv(name + "|" + (r.time || "") + "|" + (+r.ap || 0))),
    agent_id: name.toLowerCase().replace(/[^a-z0-9]+/g, "-"),
    name,
    team: String(r.team || "").toUpperCase() === "UL" ? "UL" : "SML",
    ap: +r.ap || 0,
    carrier: r.carrier || "Other",
    detail: r.product || "",
    date: dt.toLocaleDateString("en-CA", { timeZone: TZ }),
    time: dt.toLocaleTimeString("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit" }),
    ts: dt.toLocaleString("sv-SE", { timeZone: TZ }).replace(" ", "T"),
    ms: dt.getTime()
  };
}
async function davidPoll() {
  try {
    const r = await fetch(DAVID.url + (DAVID.url.indexOf("?") >= 0 ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw 0;
    const j = await r.json();
    const L = (Array.isArray(j) ? j : j.deals || []).map(davidDeal).filter((d) => d.name).sort((a, b) => a.ts.localeCompare(b.ts));
    const known = new Set(DATA.deals.map((d) => d.id));
    const fresh = DAVID.on ? L.filter((d) => !known.has(d.id)) : L;
    DAVID.on = true;
    DATA.deals = L;
    DATA.deals_updated_label = j.generated ? new Date(j.generated).toLocaleString("en-US", { timeZone: TZ, month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) + " (David feed)" : "David feed";
    const al = gate(fresh, "david");
    al.forEach((d) => SEEN_NEW.add(d.id));
    paint(cur);
    if (al.length) {
      queue.push(...al);
      runAlerts();
    }
  } catch (e) {
  }
  updLabel();
}
if (!Q.has("nodavid")) {
