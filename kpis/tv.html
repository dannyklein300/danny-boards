<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/><meta http-equiv="Pragma" content="no-cache"/><meta http-equiv="Expires" content="0"/><meta name="viewport" content="width=1920,height=1080"/>
<title>ULxSML · TV Board</title><link rel="icon" href="assets/sml_icon.png"/>
<style>

--grad:linear-gradient(110deg,#e1197a 0%,#ff7a1a 35%,#ffb020 100%);--font:"Inter","Segoe UI",system-ui,Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--navy);color:var(--cream);font-family:var(--font)}
#stage{position:fixed;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
 background:radial-gradient(900px 500px at 0% 0%,rgba(225,25,122,.22),transparent 60%),radial-gradient(900px 500px at 100% 0%,rgba(33,101,255,.22),transparent 60%),radial-gradient(1200px 600px at 50% 120%,rgba(255,122,26,.14),transparent 60%),var(--navy)}

.live i{width:12px;height:12px;border-radius:50%;background:#22d38a;box-shadow:0 0 0 0 rgba(34,211,138,.7);animation:pulse 1.6s infinite}

.slides{position:absolute;top:120px;left:56px;right:56px;bottom:70px}

.slide.on{opacity:1;transform:none}.slide.out{opacity:0;transform:translateX(-60px)}

.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:22px}

#dots{display:flex;gap:12px}#dots b{display:block;height:10px;width:44px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden;position:relative}

.row.top2{background:linear-gradient(90deg,rgba(200,210,225,.28),rgba(200,210,225,.04))!important}

.today{padding:36px 40px;display:flex;flex-direction:column;overflow:hidden;min-height:0}

.cols{flex:1;display:flex;align-items:flex-end;gap:10px;padding-top:40px}

.kt{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;margin-bottom:22px}

.kl h3{margin:0 0 10px;font-size:28px;display:flex;align-items:center;gap:12px}
.kr{display:grid;grid-template-columns:62px 1fr 110px 90px 90px 90px;align-items:center;height:46px;padding:0 14px;border-radius:10px;font-size:22px;font-weight:700}
.kr:nth-child(even){background:rgba(255,255,255,.045)}.kr.h{color:var(--muted);font-size:15px;letter-spacing:.12em;text-transform:uppercase;height:34px}

.empty{font-size:24px;color:var(--muted);padding:30px;text-align:center}
/* alert */
#alert{position:fixed;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;z-index:50;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .5s}
#alert.on{opacity:1}
#alert .bg{position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(circle at center,rgba(11,22,48,.75),rgba(11,22,48,.96))}
#alert .box{position:relative;text-align:center;transform:scale(.6);transition:transform .7s cubic-bezier(.2,1.6,.3,1)}
#alert.on .box{transform:scale(1)}
#alert .kick{font-size:44px;font-weight:900;letter-spacing:.3em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1s infinite alternate}

#alert .who{font-size:120px;font-weight:900;margin:10px 0;letter-spacing:-.02em}

#alert .car small{display:block;font-size:28px;color:var(--muted);margin-top:8px}
#alert .tb{width:70px;height:70px;font-size:22px;vertical-align:middle;margin-right:18px}
#cf{position:absolute;top:0;right:0;bottom:0;left:0;width:1920px;height:1080px}

#alert .bg{animation:flashbg .5s steps(1) infinite}
@keyframes flashbg{0%{background:radial-gradient(circle,rgba(225,25,122,.85),rgba(11,22,48,.97))}33%{background:radial-gradient(circle,rgba(255,122,26,.85),rgba(11,22,48,.97))}66%{background:radial-gradient(circle,rgba(255,176,32,.8),rgba(11,22,48,.97))}}
#alert .who{font-size:150px;text-shadow:0 8px 40px rgba(0,0,0,.6)}#alert .amt{font-size:260px;filter:drop-shadow(0 10px 40px rgba(255,176,32,.6))}
#alert.on .amt{animation:pop .6s cubic-bezier(.2,1.8,.3,1) infinite alternate}@keyframes pop{to{transform:scale(1.06)}}
.shake{animation:shake .12s linear infinite}@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-14px,8px)}50%{transform:translate(12px,-10px)}75%{transform:translate(-8px,-6px)}100%{transform:translate(10px,10px)}}
/* 2026-11-11 alert lifecycle fix: stage shake keeps the screen-fit scale; alert is fully hidden and its animations paused when off */
#stage.shake{animation-name:shakestage}@keyframes shakestage{0%{transform:translate(0,0) scale(var(--fs,1))}25%{transform:translate(-14px,8px) scale(var(--fs,1))}50%{transform:translate(12px,-10px) scale(var(--fs,1))}75%{transform:translate(-8px,-6px) scale(var(--fs,1))}100%{transform:translate(10px,10px) scale(var(--fs,1))}}
#alert{visibility:hidden;transition:opacity .5s,visibility 0s linear .5s}#alert.on{visibility:visible;transition:opacity .5s,visibility 0s}#alert:not(.on) *{animation-play-state:paused}
#snd{border:0;width:100%;height:100%;outline:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:99;display:grid;place-items:center;background:rgba(11,22,48,.92);color:var(--cream);font-family:var(--font);cursor:pointer;text-align:center}
#snd b{display:block;font-size:64px;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}#snd span{font-size:28px;color:var(--muted)}

.pod{display:flex;justify-content:center;align-items:flex-end;gap:34px;height:490px;margin-bottom:14px}
.pd{width:440px;display:flex;flex-direction:column;align-items:center;position:relative}

@keyframes sheen{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
.pd.p1{--c:#ffb020}.pd.p2{--c:#c8d2e1}.pd.p3{--c:#e08a4a}.pd.p1 .av{width:130px;height:130px;font-size:54px}.pd.p1 .pn{font-size:42px}.pd.p1 .pa{font-size:58px}
.rest{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:4px 18px}

body.lite #alert .bg{animation:none;background:radial-gradient(circle,rgba(225,25,122,.8),rgba(11,22,48,.97))}body.lite #alert.on .amt{animation:none}body.lite .pd .blk::after,body.lite .live i{animation:none}
.team{padding:26px 34px}.team .tn{font-size:36px}.team .tn img{height:52px}.team .big{font-size:84px;margin:8px 0 2px}

.t10r .rk{color:var(--muted);font-weight:900}.t10r .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.t10r .ap{font-weight:900;font-variant-numeric:tabular-nums}.t10r .dl{text-align:right;color:var(--muted);font-size:16px}

<div id="stage">
